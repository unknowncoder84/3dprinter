<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 270" width="420" height="270">
  <title>Cartoon ant (sample illustration)</title>
  <!-- legs -->
  <g fill="none" stroke="#111" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <path d="M150 165 L118 212 L92 246"/>
    <path d="M185 172 L178 222 L160 252"/>
    <path d="M225 170 L262 214 L292 244"/>
  </g>
  <!-- abdomen with stripes -->
  <ellipse cx="305" cy="128" rx="86" ry="62" fill="#111"/>
  <g fill="#fff">
