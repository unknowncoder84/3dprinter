  <!-- thorax and head -->
  <ellipse cx="200" cy="140" rx="46" ry="38" fill="#111"/>
  <circle cx="108" cy="124" r="58" fill="#111"/>
  <!-- face -->
  <circle cx="90" cy="108" r="19" fill="#fff"/>
  <circle cx="86" cy="111" r="10" fill="#111"/>
  <circle cx="83" cy="107" r="3.5" fill="#fff"/>
  <path d="M66 146 Q92 172 126 150" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
  <!-- antennae -->
  <g fill="none" stroke="#111" stroke-width="9" stroke-linecap="round">
    <path d="M86 72 Q66 34 34 28"/>
    <path d="M122 68 Q138 30 172 22"/>
  </g>
  <circle cx="30" cy="28" r="9" fill="#111"/>
  <circle cx="176" cy="21" r="9" fill="#111"/>
</svg>
